<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora's Music Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Player sticks strictly to top, left, right with zero margin/padding */
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0;
            padding: 0;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .player-wrapper {
            width: 100%;
            background: linear-gradient(135deg, var(--c5, #1a1a1a), var(--c2, #0f0f0f), var(--c3, #2a1b3d), var(--c4, #111));
            background-size: 300% 300%;
            animation: gradientAnimation 12s ease infinite;
            
            border-radius: 0px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            height: 75px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .player-main {
            display: flex;
            align-items: center;
            width: 100%;
            height: calc(100% - 6px);
            padding: 0 12px;
            gap: 10px;
            background: rgba(15, 15, 15, 0.35);
            backdrop-filter: blur(4px);
        }

        /* Left side YouTube Link Thumbnail & Info */
        .track-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex-grow: 1;
            overflow: hidden;
        }

        .yt-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
            position: relative;
            width: 44px;
            height: 33px;
            border-radius: 4px;
            overflow: hidden;
            background: #222;
        }

        .yt-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .yt-link::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
        }

        .yt-link:hover::after {
            background: rgba(0, 0, 0, 0);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex-grow: 1;
            overflow: hidden;
        }

        .brand-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--c1, #ff3385);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Marquee Container with Left-Only Seamless Loop */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            display: flex;
        }

        .track-title-wrapper {
            display: inline-flex;
            white-space: nowrap;
            will-change: transform;
            animation: scrollLeft 10s linear infinite;
        }

        .track-title {
            font-size: 12px;
            font-weight: 500;
            color: #f1f1f1;
            text-decoration: none;
            display: inline-block;
            padding-right: 40px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .track-title:hover {
            text-decoration: underline;
        }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .track-time {
            font-size: 10px;
            color: #ccc;
            margin-top: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        button.control-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            outline: none;
        }

        button.control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        button.control-btn svg {
            width: 15px;
            height: 15px;
            fill: #ddd;
            transition: fill 0.2s;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
        }

        button.control-btn:hover svg {
            fill: #fff;
        }

        button.control-btn.active svg {
            fill: var(--c1, #ff3385);
            filter: drop-shadow(0 0 6px var(--c1));
        }

        button.control-btn.primary svg {
            width: 17px;
            height: 17px;
            fill: var(--c1, #ff3385);
            filter: drop-shadow(0 0 6px var(--c1));
        }

        /* Bottom Progress / Seek Bar with All-Sides Glow */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            z-index: 2;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--c1, #ff3385);
            width: 0%;
            pointer-events: none;
            transition: background-color 0.3s ease;
            box-shadow: 0 0 10px var(--c1), 0 0 4px var(--c1);
        }

        /* Input & Embed Section Container */
        .content-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .input-group input {
            flex-grow: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: var(--c1, #ff3385);
            box-shadow: 0 0 6px var(--c1);
        }

        .input-group button {
            background: var(--c1, #ff3385);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .input-group button:hover {
            opacity: 0.85;
        }

        /* Embed Code Section */
        .embed-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #141414;
            border: 1px solid #222;
            padding: 12px;
            border-radius: 6px;
        }

        .embed-label {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .embed-row {
            display: flex;
            gap: 8px;
        }

        .embed-row textarea {
            flex-grow: 1;
            background: #0a0a0a;
            border: 1px solid #282828;
            border-radius: 4px;
            padding: 8px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 11px;
            height: 65px;
            resize: none;
            outline: none;
        }

        .embed-row button {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 0 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .embed-row button:hover {
            background: #333;
            border-color: var(--c1, #ff3385);
        }

        /* Custom Alert Box Overlay Styling */
        #customAlertOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }

        .custom-alert-box {
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px var(--c1, #ff3385);
            animation: alertPop 0.2s ease-out;
        }

        @keyframes alertPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .custom-alert-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--c1, #ff3385);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .custom-alert-message {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 20px;
            line-height: 1.4;
            word-break: break-word;
        }

        .custom-alert-btn {
            background: var(--c1, #ff3385);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 0 8px var(--c1, #ff3385);
        }

        .custom-alert-btn:hover {
            opacity: 0.85;
        }

        #youtube-player {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Custom Alert Overlay -->
    <div id="customAlertOverlay">
        <div class="custom-alert-box">
            <div class="custom-alert-title">Notice</div>
            <div id="customAlertMessage" class="custom-alert-message">Message here</div>
            <button id="customAlertOkBtn" class="custom-alert-btn">OK</button>
        </div>
    </div>

    <div class="player-wrapper" id="playerWrapper">
        <div class="player-main">
            <!-- Left: YouTube Link & Thumbnail + Track Info -->
            <div class="track-left">
                <a id="ytAnchorThumbnail" class="yt-link" href="#" target="_blank" title="Watch on YouTube" style="display: none;">
                    <img id="trackThumbnail" src="" alt="Thumbnail" crossorigin="anonymous">
                </a>
                <div class="track-info">
                    <div class="brand-title">Dora's Music Player</div>
                    <div class="marquee-container">
                        <div class="track-title-wrapper" id="marqueeWrapper">
                            <a id="ytAnchorTitle1" class="track-title" href="#" target="_blank" title="Watch on YouTube">No track loaded</a>
                            <a id="ytAnchorTitle2" class="track-title" href="#" target="_blank" title="Watch on YouTube">No track loaded</a>
                        </div>
                    </div>
                    <div id="trackTimeDisplay" class="track-time">0:00 / 0:00</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="startOverBtn" class="control-btn" title="Start Over">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="playPauseBtn" class="control-btn primary" title="Play/Pause">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="endSongBtn" class="control-btn" title="End Song">
                    <svg viewBox="0 0 24 24"><path d="M18 18h-2V6h2zM14.5 12L6 6v12z"/></svg>
                </button>
                <button id="loopBtn" class="control-btn" title="Toggle Loop">
                    <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                </button>
            </div>
        </div>

        <!-- Bottom Progress Seek Bar -->
        <div id="progressBarContainer" class="progress-bar-container" title="Seek">
            <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Input Field & Embed Section (Only visible when NO video ID is in the URL) -->
    <div id="contentContainer" class="content-container">
        <div class="input-group">
            <input type="text" id="ytInput" placeholder="Paste YouTube link or Video ID...">
            <button id="loadBtn">Play</button>
        </div>

        <div id="embedSection" class="embed-section" style="display: none;">
            <div class="embed-label">Embed Code</div>
            <div class="embed-row">
                <textarea id="embedCodeOutput" readonly></textarea>
                <button id="copyBtn">Copy</button>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Target -->
    <div id="youtube-player"></div>

    <script>
        // Custom Alert Box Function
        function showAlert(message) {
            document.getElementById('customAlertMessage').innerText = message;
            document.getElementById('customAlertOverlay').style.display = 'flex';
        }

        document.getElementById('customAlertOkBtn').addEventListener('click', () => {
            document.getElementById('customAlertOverlay').style.display = 'none';
        });

        const urlParams = new URLSearchParams(window.location.search);
        let videoId = urlParams.get('v');
        const customColor = urlParams.get('c');
        const autoplay = urlParams.get('ap') === '1' ? 1 : 0;
        const volume = parseInt(urlParams.get('vol') || '100', 10);

        let player;
        let isPlaying = false;
        let isLooping = false;
        let progressInterval;

        function extractVideoId(input) {
            input = input.trim();
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            return (match && match[2].length === 11) ? match[2] : (input.length === 11 ? input : null);
        }

        if (videoId) {
            document.getElementById('contentContainer').style.display = 'none';
            initPlayer(videoId, autoplay);
        } else {
            document.getElementById('contentContainer').style.display = 'flex';
            setTrackTitle('Enter a song below');
            document.getElementById('trackTimeDisplay').innerText = 'Idle';
        }

        document.getElementById('loadBtn').addEventListener('click', handleUserSubmit);
        document.getElementById('ytInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUserSubmit();
        });

        function handleUserSubmit() {
            const val = document.getElementById('ytInput').value;
            const newId = extractVideoId(val);
            if (newId) {
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(newId);
                    updateThumbnailAndTheme(newId);
                    player.playVideo();
                } else {
                    videoId = newId;
                    initPlayer(newId, 1);
                }
                document.getElementById('ytInput').value = '';
                generateEmbedCode(newId);
            } else {
                showAlert('Please enter a valid YouTube link or 11-character Video ID.');
            }
        }

        function generateEmbedCode(vid) {
            const currentOrigin = window.location.origin;
            const embedCode = `<div style="width:100%;overflow:hidden;"><iframe allow="autoplay; encrypted-media" src="${currentOrigin}/?v=${vid}&ap=1&vol=100" style="display:block;width:100.5%;height:75px;border:none;margin-left:-0.25%;"
></iframe></div>`;

            document.getElementById('embedCodeOutput').value = embedCode;
            document.getElementById('embedSection').style.display = 'flex';
        }

        // Cross-device and cross-browser universal copy handler
        document.getElementById('copyBtn').addEventListener('click', () => {
            const textarea = document.getElementById('embedCodeOutput');
            textarea.select();
            textarea.setSelectionRange(0, 99999);

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textarea.value).then(() => {
                        showCopySuccess();
                    }).catch(() => {
                        fallbackCopy(textarea);
                    });
                } else {
                    fallbackCopy(textarea);
                }
            } catch (err) {
                fallbackCopy(textarea);
            }
        });

        function fallbackCopy(textarea) {
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopySuccess();
                } else {
                    showAlert('Failed to copy. Please select and copy manually.');
                }
            } catch (err) {
                showAlert('Failed to copy. Please select and copy manually.');
            }
        }

        function showCopySuccess() {
            const btn = document.getElementById('copyBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Copied!';
            btn.style.background = 'var(--c1, #ff3385)';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = '#222';
                btn.style.color = '#fff';
            }, 2000);
        }

        function setTrackTitle(text, url = '#') {
            const t1 = document.getElementById('ytAnchorTitle1');
            const t2 = document.getElementById('ytAnchorTitle2');
            t1.innerText = text;
            t2.innerText = text;
            t1.href = url;
            t2.href = url;
        }

        function updateThumbnailAndTheme(vid) {
            const ytUrl = `https://www.youtube.com/watch?v=${vid}`;
            const thumbnailAnchor = document.getElementById('ytAnchorThumbnail');
            thumbnailAnchor.style.display = 'flex';
            thumbnailAnchor.href = ytUrl;
            
            const thumbnailImg = document.getElementById('trackThumbnail');
            thumbnailImg.src = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;

            thumbnailImg.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 50;
                    canvas.height = 50;
                    ctx.drawImage(thumbnailImg, 0, 0, 50, 50);
                    
                    const imgData = ctx.getImageData(0, 0, 50, 50).data;
                    let colors = [];
                    let brightestColor = { r: 255, g: 51, b: 133, score: -1 };

                    for (let i = 0; i < imgData.length; i += 16) {
                        let tr = imgData[i];
                        let tg = imgData[i+1];
                        let tb = imgData[i+2];
                        
                        let brightness = (tr * 299 + tg * 587 + tb * 114) / 1000;
                        let saturationScore = brightness * (Math.max(tr, tg, tb) - Math.min(tr, tg, tb));
                        if (saturationScore > brightestColor.score && brightness > 30 && brightness < 245) {
                            brightestColor = { r: tr, g: tg, b: tb, score: saturationScore };
                        }

                        if (brightness > 20 && brightness < 240) {
                            if (brightness < 80) {
                                let factor = 130 / (brightness || 1);
                                tr = Math.min(255, Math.floor(tr * factor));
                                tg = Math.min(255, Math.floor(tg * factor));
                                tb = Math.min(255, Math.floor(tb * factor));
                            }
                            colors.push({ r: tr, g: tg, b: tb });
                        }
                    }

                    let c1 = `rgb(${brightestColor.r}, ${brightestColor.g}, ${brightestColor.b})`;
                    let c5 = `rgb(${colors[Math.floor(colors.length/4)]?.r || 26}, ${colors[Math.floor(colors.length/4)]?.g || 26}, ${colors[Math.floor(colors.length/4)]?.b || 26})`;
                    let c2 = `rgb(${colors[Math.floor(colors.length/3)]?.r || 40}, ${colors[Math.floor(colors.length/3)]?.g || 20}, ${colors[Math.floor(colors.length/3)]?.b || 60})`;
                    let c3 = `rgb(${colors[Math.floor(colors.length/1.5)]?.r || 100}, ${colors[Math.floor(colors.length/1.5)]?.g || 30}, ${colors[Math.floor(colors.length/1.5)]?.b || 200})`;
                    let c4 = `rgb(${colors[colors.length-1]?.r || 20}, ${colors[colors.length-1]?.g || 20}, ${colors[colors.length-1]?.b || 30})`;

                    if (customColor) {
                        c1 = '#' + customColor;
                    }

                    document.documentElement.style.setProperty('--c1', c1);
                    document.documentElement.style.setProperty('--c5', c5);
                    document.documentElement.style.setProperty('--c2', c2);
                    document.documentElement.style.setProperty('--c3', c3);
                    document.documentElement.style.setProperty('--c4', c4);
                } catch (e) {
                    console.log("Using default accent color due to CORS restrictions.");
                }
            };
        }

        function initPlayer(vid, autoPlayState) {
            updateThumbnailAndTheme(vid);

            if (!window.YT) {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            } else if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(vid);
                return;
            }

            window.onYouTubeIframeAPIReady = function() {
                player = new YT.Player('youtube-player', {
                    height: '0',
                    width: '0',
                    videoId: vid,
                    playerVars: {
                        'autoplay': autoPlayState,
                        'controls': 0,
                        'disablekb': 1,
                        'fs': 0,
                        'iv_load_policy': 3,
                        'modestbranding': 1,
                        'playsinline': 1
                    },
                    events: {
                        'onReady': (e) => {
                            e.target.setVolume(volume);
                            if (autoPlayState) e.target.playVideo();
                            updateTrackMetadata();
                        },
                        'onStateChange': onPlayerStateChange
                    }
                });
            };
        }

        function updateTrackMetadata() {
            try {
                const videoData = player.getVideoData();
                const ytUrl = `https://www.youtube.com/watch?v=${videoId}`;
                if (videoData && videoData.title) {
                    setTrackTitle(videoData.title, ytUrl);
                } else {
                    setTrackTitle(`YouTube Track (${videoId})`, ytUrl);
                }
            } catch (e) {
                setTrackTitle(`YouTube Track (${videoId})`, `https://www.youtube.com/watch?v=${videoId}`);
            }
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');

            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                startProgressTracker();
                updateTrackMetadata();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                stopProgressTracker();
            } else if (event.data === YT.PlayerState.ENDED) {
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                stopProgressTracker();
                
                if (isLooping) {
                    player.seekTo(0);
                    player.playVideo();
                }
            }
        }

        function startProgressTracker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!player || typeof player.getCurrentTime !== 'function') return;
                const currentTime = player.getCurrentTime();
                const duration = player.getDuration();
                
                if (duration > 0) {
                    const percent = (currentTime / duration) * 100;
                    document.getElementById('progressBarFill').style.width = `${percent}%`;
                    document.getElementById('trackTimeDisplay').innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                }
            }, 500);
        }

        function stopProgressTracker() {
            clearInterval(progressInterval);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        document.getElementById('startOverBtn').addEventListener('click', () => {
            if (!player) return;
            player.seekTo(0);
            player.playVideo();
        });

        document.getElementById('endSongBtn').addEventListener('click', () => {
            if (!player) return;
            const duration = player.getDuration();
            player.seekTo(duration);
            player.pauseVideo();
            document.getElementById('progressBarFill').style.width = `100%`;
        });

        const loopBtn = document.getElementById('loopBtn');
        loopBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            loopBtn.classList.toggle('active', isLooping);
        });

        const progressBarContainer = document.getElementById('progressBarContainer');
        progressBarContainer.addEventListener('click', (e) => {
            if (!player || typeof player.getDuration !== 'function') return;
            const rect = progressBarContainer.getBoundingClientRect();
            const clickPosition = (e.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            const seekTarget = clickPosition * duration;
            
            player.seekTo(seekTarget, true);
            document.getElementById('progressBarFill').style.width = `${clickPosition * 100}%`;
        });
    </script>
</body>
</html>
